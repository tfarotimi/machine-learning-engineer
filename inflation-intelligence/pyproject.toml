[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "inflation-intelligence"
version = "0.1.0"
description = "Data feasibility and applied-AI inflation forecasting research for Chile"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

